services:

  # ---------- POSTGRES ----------
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  # ---------- AIRFLOW INIT ----------
  airflow-init:
    build: 
      context: .
    container_name: airflow-init
    depends_on:
      - postgres
    user: "0:0"
    command: >
      bash -c " airflow db init &&
      airflow users create
      --username \"$$AIRFLOW_ADMIN_USERNAME\"
      --password \"$$AIRFLOW_ADMIN_PASSWORD\"
      --firstname \"$$AIRFLOW_ADMIN_FIRSTNAME\"
      --lastname \"$$AIRFLOW_ADMIN_LASTNAME\"
      --role Admin
      --email \"$$AIRFLOW_ADMIN_EMAIL\"
      "
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME}
      AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL}
    volumes:
      - ./airflow_505:/opt/airflow

  # ---------- AIRFLOW WEBSERVER ----------
  airflow-webserver:
    build: 
      context: .
    container_name: airflow-webserver
    depends_on:
      - airflow-init
    user: "0:0"
    ports:
      - "8082:8080"
    command: bash -c "airflow webserver"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    volumes:
      - ./airflow_505:/opt/airflow

  # ---------- AIRFLOW SCHEDULER ----------
  airflow-scheduler:
    build: 
      context: .
    container_name: airflow-scheduler
    depends_on:
      - airflow-init
    user: "0:0"
    command: bash -c "airflow scheduler"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth

      INGESTION_DB_USERNAME: ${INGESTION_DB_USERNAME}
      INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD}
      INGESTION_DB_URL: ${INGESTION_DB_URL}
    volumes:
      - ./airflow_505:/opt/airflow

volumes:
  postgres-db-volume:
